version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: tripsplit-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: tripsplit
      POSTGRES_PASSWORD: tripsplit
      POSTGRES_DB: tripsplit
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tripsplit -d tripsplit"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: tripsplit-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: tripsplit
      DB_PASSWORD: tripsplit
      DB_NAME: tripsplit
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend/frontend
      dockerfile: ../Dockerfile
    container_name: tripsplit-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres-data: